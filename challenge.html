<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>15-Day Core Java Challenge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>">
<style>
:root{color-scheme:light;--bg:#fff;--alt:#f6f8fc;--sf:#f0f4f9;--ln:#e3e8ef;--tx:#1f1f1f;--mut:#5f6368;--bl:#0b57d0;--bd:#0842a0;--ok:#188038;--g:linear-gradient(90deg,#4285f4,#9b72cb 50%,#d96570)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{font-family:"Google Sans","Google Sans Text",Roboto,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;min-height:100dvh;overflow-x:hidden;background-image:radial-gradient(60vw 40vw at 10% -5%,rgba(66,133,244,.10),transparent 70%),radial-gradient(50vw 35vw at 95% 0,rgba(217,101,112,.08),transparent 70%);background-repeat:no-repeat}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
.w{max-width:760px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
.pg{padding-top:26px;padding-bottom:56px}
.hdr{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:600}.logo svg{width:24px;height:24px}
.gt{background:var(--g);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;background:var(--bl);color:#fff;font-weight:500;font-size:15px;padding:10px 20px;border-radius:26px;border:1px solid var(--bl);transition:.2s}
.btn:hover{background:var(--bd)}.btn.o{background:#fff;color:var(--bl);border-color:#c4d4ee}.btn.o:hover{background:var(--sf)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tag{display:inline-flex;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--mut)}
h1{font-size:clamp(32px,9vw,48px);line-height:1.1;font-weight:600;letter-spacing:-1px;margin:14px 0 10px}
h2,h3{font-weight:600}
.sub,.sm{color:var(--mut)}.sub{font-size:16px}.sm{font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0 14px}
.stat{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:16px 14px}
.stat b{display:block;font-size:26px;font-weight:600;line-height:1.2}.stat span{font-size:12.5px;color:var(--mut)}
.bar{height:8px;background:var(--sf);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .5s}
.sh{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:26px 0 12px}
.bd{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.bd::-webkit-scrollbar{display:none}
.bg{flex:none;border:1px solid var(--ln);border-radius:20px;padding:7px 14px;font-size:13.5px;background:#fff;color:var(--mut)}
.bg.on{background:#e8f0fe;border-color:#a8c7fa;color:var(--bl);font-weight:600}
.win{background:linear-gradient(135deg,#e8f0fe,#f3e8fd 55%,#fde8ec);border-radius:22px;padding:22px;margin-top:22px}
.win h3{font-size:20px;margin-bottom:4px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--ln);border-radius:18px;background:#fff;width:100%;text-align:left;margin-bottom:10px;min-height:70px;transition:.2s}
button.row:hover{border-color:#a8c7fa;box-shadow:0 8px 24px rgba(31,60,120,.08)}
.row.now{border-color:#a8c7fa;background:#f4f8ff}.row.lock{opacity:.55}
.num{width:38px;height:38px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font-size:14px;font-weight:600;flex:none}
.num.ok{background:#e6f4ea;color:var(--ok)}.row.now .num{background:var(--bl);color:#fff}
.mid{flex:1;min-width:0}.tt{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{font-size:22px;color:var(--mut)}
.lv{font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:20px;display:inline-block}
.easy{background:#e6f4ea;color:#188038}.med{background:#fef3e0;color:#b06000}.big{background:#fce8e6;color:#c5221f}.fin{background:var(--g);color:#fff}
.card{background:#fff;border:1px solid var(--ln);border-radius:22px;padding:clamp(20px,5vw,32px)}
.card h2{font-size:clamp(26px,7vw,36px);line-height:1.15;letter-spacing:-.6px;margin:12px 0 4px}
h4{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--bl);margin:24px 0 10px}
.card p{font-size:16px}
.rl{list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:10px}
.rl li{counter-increment:r;display:flex;gap:12px;align-items:flex-start;background:var(--alt);border-radius:14px;padding:12px 14px;font-size:15.5px}
.rl li:before{content:counter(r);flex:none;width:24px;height:24px;border-radius:50%;background:var(--bl);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.rule{background:#e8f0fe;border-radius:14px;padding:14px 16px;font-size:14.5px;margin-top:22px}
.nav{display:flex;gap:10px;margin-top:14px}.nav .btn{flex:1}
.dock{position:sticky;bottom:0;z-index:10;margin:14px -20px 0;padding:16px 20px max(14px,env(safe-area-inset-bottom));background:linear-gradient(to top,#fff 72%,rgba(255,255,255,0))}
.pri{background:var(--bl);color:#fff;border:0;border-radius:28px;padding:16px;font-weight:600;font-size:16px;width:100%;min-height:54px;transition:.2s}
.pri:hover{background:var(--bd)}.pri.undo{background:#e6f4ea;color:var(--ok)}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;background:radial-gradient(70vw 50vw at 20% 0,rgba(66,133,244,.14),transparent 70%),radial-gradient(60vw 45vw at 100% 10%,rgba(217,101,112,.12),transparent 70%),#fff}
.ac{width:100%;max-width:420px;background:#fff;border:1px solid var(--ln);border-radius:26px;padding:32px 24px;box-shadow:0 24px 60px rgba(31,60,120,.12)}
.ac .st2{display:block;width:44px;height:44px;margin:0 auto 12px}
.ac h2{text-align:center;font-size:26px;letter-spacing:-.5px}.ac>p{text-align:center;color:var(--mut);font-size:15px;margin:6px 0 22px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.f label{font-size:13px;color:var(--mut);font-weight:500}
.f input{width:100%;background:var(--sf);border:1px solid transparent;padding:14px 16px;border-radius:14px;font-size:16px;outline:0;color:var(--tx)}
.f input:focus{border-color:var(--bl);background:#fff}
.ac .pri{margin-top:6px}
.sw{text-align:center;margin-top:18px;font-size:14px;color:var(--mut)}.sw a{color:var(--bl);font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media(max-width:380px){.stat b{font-size:21px}.stat{padding:14px 10px}.logo{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4285f4"/><stop offset=".55" stop-color="#9b72cb"/><stop offset="1" stop-color="#d96570"/></linearGradient><symbol id="sp" viewBox="0 0 24 24"><path fill="url(#gg)" d="M12 0Q13 11 24 12Q13 13 12 24Q11 13 0 12Q11 11 12 0Z"/></symbol></defs></svg>

<!-- LOGIN / SIGNUP -->
<div class="ov hide" id="auth">
  <div class="ac">
    <svg class="st2"><use href="#sp"/></svg>
    <h2 id="aT">Welcome back</h2>
    <p id="aS">Log in to continue your Core Java journey</p>
    <form id="aF">
      <div class="f" id="aNg" style="display:none"><label>Full name</label><input id="aN" placeholder="Your name" autocomplete="name"></div>
      <div class="f"><label>Email address</label><input id="aE" type="email" required placeholder="name@example.com" autocomplete="email"></div>
      <div class="f"><label>Password</label><input id="aP" type="password" required placeholder="••••••••" autocomplete="current-password"></div>
      <button class="pri" id="aB">Log in</button>
    </form>
    <div class="sw"><span id="aW">Don't have an account?</span> <a id="aL">Sign up</a></div>
  </div>
</div>

<div class="hide" id="app">
  <header class="hdr"><div class="w"><div class="top">
    <a class="logo" href="index.html"><svg><use href="#sp"/></svg>Java Challenge</a>
    <button class="btn o" id="out">Log out</button>
  </div></div></header>

  <main class="w pg">
    <!-- SCREEN 1: HOME -->
    <section id="home">
      <span class="tag">🚀 15 days · 15 programs · Pure Core Java</span>
      <h1 id="hi"></h1>
      <p class="sub">A new challenge unlocks every day. Build each program yourself in Core Java.</p>
      <div class="stats" id="stats"></div>
      <div class="bar"><i id="pb"></i></div>
      <h3 class="sh">Your badges</h3>
      <div class="bd" id="bd"></div>
      <div id="fin"></div>
      <h3 class="sh">Challenges</h3>
      <div id="list"></div>
    </section>

    <!-- SCREEN 2: QUESTION -->
    <section id="task" class="hide"></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbynrCBMhXcWD8QVAvrfYE5idNthcjF6J_VCX0vKucxdK3fyixtXaSFWNg6RpWK2cfE7/exec";
const RULE = "Use only Core Java. No Spring, JDBC, Android, GUI frameworks, APIs, databases or external libraries. Don't copy solutions — build it yourself.";
const D = [
["easy","Calculator","Create a console-based calculator that takes two numbers and an arithmetic operator from the user and performs the selected operation.","Take two numbers as input|Take an operator: + - * / %|Perform the operation and display the result|Handle division by zero|Display an error for an invalid operator|Use switch|Create separate methods for operations where appropriate"],
["easy","Student Marks & Grade System","Accept the marks of a student in 5 subjects and calculate total marks, percentage, grade and result.","Take the student name|Take marks for 5 subjects (each between 0 and 100)|Calculate total marks and percentage|Grade: 90–100 A+, 80–89 A, 70–79 B, 60–69 C, 50–59 D, below 50 F|Below 35 in any subject = FAIL|Display a complete result"],
["easy","Number Guessing Game","The computer randomly selects a number between 1 and 100 and the user has to guess it.","Generate a random number from 1–100 using the Random class|Ask for guesses and show Too Low / Too High|Display a success message when correct|Count the number of attempts|Allow the user to play again"],
["med","ATM Simulator","Create a console-based ATM simulation. Starting balance: ₹10,000. Menu: 1 Check Balance, 2 Deposit, 3 Withdraw, 4 Change PIN, 5 Exit.","Ask for a PIN; allow max 3 incorrect attempts, then deny access|Check balance, deposit and withdraw money|Prevent withdrawal if balance is insufficient|Prevent negative or zero transactions|Allow the user to change the PIN|Keep showing the menu until the user selects Exit"],
["med","Quiz Application","Create a console-based multiple-choice quiz containing 10 questions.","Create 10 MCQs, each with 4 options|Store questions and answers using arrays|1 mark for a correct answer, 0 for incorrect|Show whether each answer is correct or incorrect|Display total questions, correct answers, wrong answers, score and percentage"],
["med","Student Management System","Store and manage multiple students (Roll Number, Name, Age, Class, Percentage). Menu: Add, Display All, Search, Update, Delete, Exit.","Create a Student class and store objects in an ArrayList|Roll numbers must be unique|Search students using roll number|Update student information and delete students|Display all students|Handle invalid student IDs properly"],
["med","Expense Tracker","Build a personal expense tracker (ID, Description, Category, Amount, Date). Categories: Food, Travel, Education, Shopping, Other.","Store multiple expenses with a generated unique ID|Add, view all and delete an expense by ID|Search expenses by category|Calculate total expenses and find the highest expense|Use classes, objects, methods and ArrayList"],
["med","Bank Account System","Manage multiple customer accounts (Account Number, Holder Name, Type, Balance).","Create accounts with unique account numbers|Deposit and withdraw money (block if balance is insufficient)|Check balance and display account details|Transfer money between two accounts|Search accounts by account number|Manage accounts with ArrayList using OOP principles"],
["big","Library Management System","Build a complete console-based library system for a school (Books and Members).","Separate Book (ID, name, author, category, availability) and Member (ID, name, class) classes|Book IDs and Member IDs must be unique|Add, display and delete books; search by ID or name|Add members|Only available books can be issued; mark unavailable on issue and available on return|Display all currently issued books|Prevent invalid book/member operations; use ArrayList"],
["big","Hospital Management System","Manage patients, doctors and appointments.","Separate Patient (ID, name, age, gender, disease), Doctor (ID, name, specialization) and Appointment (ID, patient ID, doctor ID, date) classes|IDs must be unique|Search patients and doctors by ID|Book an appointment only for an existing patient and doctor|Display and cancel appointments|Prevent invalid IDs; use ArrayList"],
["big","Railway Reservation System","Build a console-based railway reservation system with trains and passengers.","Add and display multiple trains (number, name, source, destination, seats)|Search trains by number or destination|Book a ticket if seats are available and assign a seat number|Reduce available seats on booking, increase on cancellation|Generate a unique passenger/ticket ID and display ticket details|Prevent booking when full and cancelling an invalid ticket"],
["big","Hotel Management System","Manage rooms, customers, bookings and bills.","Add rooms of different types (number, type, price per day, availability)|Display rooms and search available rooms|Register customers (ID, name, age, phone)|Book an available room and mark it unavailable|Calculate the bill by number of days plus optional extra charges|Free the room after check-out and generate a complete bill"],
["big","Online Shopping System","Create a console-based online shopping application.","Add and manage products (ID, name, category, price, stock)|Search products and display them by category|Register customers (ID, name, email)|Add to cart, change quantity, remove and view cart|Check stock before adding to cart|Calculate subtotal and final bill|Reduce stock at checkout, generate an order ID and store order history"],
["big","Banking Management System","Build a larger banking system with customers, accounts and transactions.","Register customers (ID, name, age, phone); one customer can have multiple accounts|Open and close accounts with unique IDs|Deposit, withdraw and transfer money|Maintain transaction history (ID, type, amount, date, account)|Search customers and display account details|Prevent invalid and insufficient-balance transactions|Use multiple classes, ArrayList and proper encapsulation"],
["fin","Student Examination System","The final project: register students, take exams and receive results.","Register students with unique IDs; search students|Add and display multiple subjects|Add MCQ questions (4 options, correct answer, marks) to subjects|Start an exam: select student and subject, show questions one by one|Calculate marks, correct/wrong answers, percentage, grade and PASS/FAIL|Show a full result and student result history|Demonstrate as many Core Java concepts as possible: data types, operators, if-else, switch, loops, arrays, strings, methods, classes, constructors, encapsulation, inheritance, polymorphism, abstraction, interfaces, ArrayList, exception handling"]
];
const LV={easy:["Easy","easy",100],med:["Medium","med",150],big:["Big","big",250],fin:["Final Project","fin",500]};
const $=id=>document.getElementById(id);
const iso=d=>d.toLocaleDateString('en-CA'),today=()=>iso(new Date()),dt=s=>new Date(s+'T00:00:00');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let U=JSON.parse(localStorage.getItem('j15_user')||'null'),P,signup=false,tt;

/* ===== PROGRESS ===== */
const pk=()=>'j15_p_'+U.email,save=()=>localStorage.setItem(pk(),JSON.stringify(P));
function load(){P=Object.assign({start:today(),done:[],chk:{},dates:{},code:{},time:{}},JSON.parse(localStorage.getItem(pk())||'null')||{});save()}
const unlocked=()=>Math.min(15,Math.round((dt(today())-dt(P.start))/864e5)+1);
const unlockDate=n=>{const d=dt(P.start);d.setDate(d.getDate()+n-1);return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})};
const xp=()=>P.done.reduce((s,n)=>s+LV[D[n-1][0]][2],0);
function streak(){const s=new Set(Object.values(P.dates)),d=new Date();let c=0;if(!s.has(iso(d)))d.setDate(d.getDate()-1);while(s.has(iso(d))){c++;d.setDate(d.getDate()-1)}return c}
const has=(a,b)=>{for(let i=a;i<=b;i++)if(!P.done.includes(i))return 0;return 1};
const B=[["🌱","First Step",()=>P.done.length>0],["🟢","Easy Cleared",()=>has(1,3)],["🟡","Medium Master",()=>has(4,8)],["🔴","Big Builder",()=>has(9,14)],["🔥","3-Day Streak",()=>streak()>=3],["🏆","Java Champion",()=>P.done.length==15]];
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}

/* ===== AUTH (same Google Sheet backend) ===== */
function mode(s){signup=s;$('aT').textContent=s?'Create your account':'Welcome back';$('aS').textContent=s?'Sign up to begin the 15-day challenge':'Log in to continue your Core Java journey';$('aNg').style.display=s?'flex':'none';$('aB').textContent=s?'Sign up':'Log in';$('aW').textContent=s?'Already have an account?':"Don't have an account?";$('aL').textContent=s?'Log in':'Sign up'}
$('aL').onclick=()=>mode(!signup);
$('aF').onsubmit=async e=>{
  e.preventDefault();
  const email=$('aE').value.trim().toLowerCase(),password=$('aP').value.trim(),name=$('aN').value.trim();
  if(signup&&!name){alert('Please enter your full name.');return}
  $('aB').disabled=true;$('aB').textContent='Connecting...';
  try{await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:signup?'signup':'login',name,email,password,loginDate:new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'})})})}catch(err){console.error(err)}
  if(name)localStorage.setItem('j15_n_'+email,name);
  U={name:name||localStorage.getItem('j15_n_'+email)||email.split('@')[0],email};
  localStorage.setItem('j15_user',JSON.stringify(U));
  $('aB').disabled=false;$('aB').textContent=signup?'Sign up':'Log in';start();
};
$('out').onclick=()=>{if(confirm('Are you sure you want to log out?')){localStorage.removeItem('j15_user');U=null;history.replaceState(null,'','#');$('app').classList.add('hide');$('auth').classList.remove('hide');mode(false)}};
function start(){
  load();$('auth').classList.add('hide');$('app').classList.remove('hide');
  const h=location.hash;if(/^#day-\d+$/.test(h)){history.replaceState(null,'','#');history.pushState({t:1},'',h)}
  route();
}

/* ===== SCREEN 1: HOME ===== */
function home(){
  const u=unlocked(),dn=P.done.length,x=xp(),h=new Date().getHours();
  $('hi').innerHTML=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+',<br><span class="gt">'+esc(U.name)+'</span>';
  $('stats').innerHTML=[[streak(),'🔥 day streak'],[x.toLocaleString(),'⚡ XP · Level '+(1+Math.floor(x/500))],[dn+'/15','✅ completed']].map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('');
  $('pb').style.width=Math.round(dn/15*100)+'%';
  $('bd').innerHTML=B.map(b=>`<span class="bg ${b[2]()?'on':''}">${b[2]()?b[0]:'🔒'} ${b[1]}</span>`).join('');
  $('fin').innerHTML=dn==15?`<div class="win"><h3>🎉 Challenge complete!</h3><p>You built all 15 Core Java programs. Outstanding work, ${esc(U.name)}!</p></div>`:'';
  const cur=D.findIndex((d,i)=>i+1<=u&&!P.done.includes(i+1))+1;
  $('list').innerHTML=D.map((d,i)=>{
    const n=i+1,lv=LV[d[0]],ok=P.done.includes(n);
    if(n>u)return `<div class="row lock"><span class="num">🔒</span><div class="mid"><div class="tt">Locked</div><div class="sm">Day ${n} · unlocks ${unlockDate(n)}</div></div></div>`;
    return `<button class="row ${n==cur?'now':''}" onclick="nav('day-${n}')"><span class="num ${ok?'ok':''}">${ok?'✓':n}</span><div class="mid"><div class="tt">${d[1]}</div><div class="sm"><span class="lv ${lv[1]}">${lv[0]}</span> ${ok?'Completed':n==cur?'Open today':'Open'}</div></div><span class="chev">›</span></button>`;
  }).join('');
}

/* ===== SCREEN 2: QUESTION ===== */
function task(n){
  const d=D[n-1],lv=LV[d[0]],dn=P.done.includes(n);
  $('task').innerHTML=`
  <button class="btn o" onclick="back()">‹ All challenges</button>
  <div class="card" style="margin-top:16px">
    <span class="lv ${lv[1]}">${lv[0]}</span> <span class="sm">Day ${n} of 15 · +${lv[2]} XP</span>
    <h2>${d[1]}</h2>
    <h4>Problem</h4><p>${d[2]}</p>
    <h4>Requirements</h4>
    <ol class="rl">${d[3].split('|').map(r=>`<li>${r}</li>`).join('')}</ol>
    <div class="rule"><b>Rule:</b> ${RULE}</div>
  </div>
  <div class="nav">
    <button class="btn o" ${n>1?`onclick="swap('day-${n-1}')"`:'disabled'}>‹ Previous</button>
    <button class="btn o" ${n<unlocked()?`onclick="swap('day-${n+1}')"`:'disabled'}>Next ›</button>
  </div>
  <div class="dock"><button class="pri ${dn?'undo':''}" onclick="done(${n})">${dn?'✓ Completed — tap to undo':'Mark Day '+n+' as completed'}</button></div>`;
}
function done(n){
  const before=B.map(b=>b[2]()),k=P.done.indexOf(n);
  if(k>-1){P.done.splice(k,1);delete P.dates[n]}else{P.done.push(n);P.dates[n]=today()}
  save();
  const nb=B.filter((b,i)=>!before[i]&&b[2]()).map(b=>b[1]);
  if(nb.length)toast('🏅 Badge unlocked: '+nb.join(', '));
  if(k<0&&P.done.length==15){back();return}
  task(n);
}

/* ===== ROUTER (mobile back button works between screens) ===== */
const nav=h=>{history.pushState({t:1},'','#'+h);route()};
const swap=h=>{history.replaceState(history.state,'','#'+h);route()};
const back=()=>history.state&&history.state.t?history.back():(history.replaceState(null,'','#'),route());
function route(){
  if(!U)return;
  const m=location.hash.match(/^#day-(\d+)$/),n=m?+m[1]:0;
  if(n>=1&&n<=15&&n<=unlocked()){$('home').classList.add('hide');$('task').classList.remove('hide');task(n)}
  else{if(n)history.replaceState(null,'','#');$('task').classList.add('hide');$('home').classList.remove('hide');home()}
  window.scrollTo(0,0);
}
addEventListener('popstate',route);

if(U){start()}else{$('auth').classList.remove('hide');mode(false)}
</script>
